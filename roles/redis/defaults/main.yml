---
# Redis version và package
redis_version: "7.0"
redis_user: "redis"
redis_group: "redis"

# Default Redis configuration
redis_timeout: 0
redis_tcp_keepalive: 300
redis_tcp_backlog: 511
redis_maxclients: 10000

# Persistence settings
redis_save_enabled: true
redis_save_rules:
  - "900 1"
  - "300 10"
  - "60 10000"

# Security
redis_bind_interface: "127.0.0.1"
redis_protected_mode: yes
redis_requirepass: ""

# Logging
redis_loglevel: "notice"
redis_syslog_enabled: false

# Directory paths
redis_dir: "/var/lib/redis"
redis_config_dir: "/etc/redis"
redis_log_dir: "/var/log/redis"


# Default Redis settings
redis_version: latest
redis_bind_interface: 127.0.0.1
redis_default_port: 6379

# Directory permissions
redis_dir_mode: '0755'
redis_file_mode: '0644'
redis_config_mode: '0640'

# Service management
redis_enabled_on_startup: true
redis_service_state: started

# Backup settings
redis_backup_config: true
redis_backup_dir: /opt/redis/backups

# Monitoring settings
redis_slowlog_log_slower_than: 10000
redis_slowlog_max_len: 128

# Redis Configuration
redis_user: redis
redis_group: redis
redis_base_dir: /opt/redis
redis_log_dir: /var/log/redis
redis_run_dir: /var/run/redis

# Multiple Redis Instances Configuration
redis_instances:
  - name: redis-cache
    port: 6379
    maxmemory: "2gb"
    maxmemory_policy: "allkeys-lru"
    databases: 1
    save_config: "900 1 300 10 60 10000"
    description: "Main cache instance"
    
  - name: redis-session
    port: 6380
    maxmemory: "1gb"
    maxmemory_policy: "volatile-ttl"
    databases: 8
    save_config: "300 10 60 1000"
    description: "Session storage instance"
    
  - name: redis-queue
    port: 6381
    maxmemory: "1gb"
    maxmemory_policy: "noeviction"
    databases: 16
    save_config: "60 1000"
    description: "Message queue instance"

# Security settings
redis_requireauth: false
redis_password: ""

# Performance tuning
redis_tcp_backlog: 511
redis_tcp_keepalive: 300
redis_maxclients: 10000
redis_timeout: 0

# Logging
redis_loglevel: notice
redis_syslog_enabled: false

# Persistence settings
redis_rdbcompression: true
redis_rdbchecksum: true
redis_stop_writes_on_bgsave_error: true

# AOF settings
redis_appendonly: false
redis_appendfsync: everysec
redis_auto_aof_rewrite_percentage: 100
redis_auto_aof_rewrite_min_size: 64mb

