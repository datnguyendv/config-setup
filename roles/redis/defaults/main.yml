---
# Redis deployment mode: standalone hoặc cluster
redis_deployment_mode: "standalone"

# Redis version
redis_version: "7.0"

# Basic Redis configuration
redis_port: 6379
redis_bind: "127.0.0.1"
redis_requirepass: ""
redis_maxmemory: "256mb"
redis_maxmemory_policy: "allkeys-lru"

# Directories
redis_config_dir: "/etc/redis"
redis_data_dir: "/var/lib/redis"
redis_log_dir: "/var/log/redis"
redis_pid_dir: "/var/run/redis"

# Redis user and group
redis_user: "redis"
redis_group: "redis"

# Cluster specific configuration
redis_cluster_enabled: "{{ true if redis_deployment_mode == 'cluster' else false }}"
redis_cluster_config_file: "{{ redis_config_dir }}/nodes.conf"
redis_cluster_node_timeout: 15000
redis_cluster_require_full_coverage: "no"

# List of cluster nodes (required for cluster mode)
redis_cluster_nodes: []
#  - { host: "192.168.1.10", port: 6379 }
#  - { host: "192.168.1.11", port: 6379 }
#  - { host: "192.168.1.12", port: 6379 }

# Package names per OS family
redis_packages:
  RedHat:
    - redis
    - python3-redis
  Debian:
    - redis-server
    - python3-redis

# Service names per OS family
redis_service_name:
  RedHat: "redis"
  Debian: "redis-server"
