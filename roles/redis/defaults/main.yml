---
# Redis deployment configuration
redis_deployment_mode: standalone
redis_version: "7.0"
redis_port: 6379
redis_bind: "127.0.0.1"
redis_password: ""
redis_maxmemory: "256mb"
redis_maxmemory_policy: "allkeys-lru"

# Redis directories
redis_dir: "/var/lib/redis"
redis_conf_dir: "/etc/redis"
redis_log_dir: "/var/log/redis"
redis_pid_file: "/var/run/redis/redis-server.pid"

# Service configuration
redis_service_name: "redis-server"
redis_user: "redis"
redis_group: "redis"

# Replication settings (for master-slave mode)
redis_master_ip: ""
redis_replica_priority: 100
redis_replica_read_only: yes

# Sentinel settings
redis_sentinel_port: 26379
redis_sentinel_master_name: "mymaster"
redis_sentinel_quorum: 2
redis_sentinel_down_after: 30000
redis_sentinel_failover_timeout: 180000
redis_sentinel_parallel_syncs: 1

# Security
redis_protected_mode: yes
redis_tcp_keepalive: 300

# Performance tuning
redis_tcp_backlog: 511
redis_timeout: 0
redis_databases: 16
redis_save:
  - "900 1"
  - "300 10"
  - "60 10000"
redis_os_family: "{{ ansible_os_family }}"
