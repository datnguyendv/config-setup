# Redis cluster configuration
bind {{ redis_bind }}
port {{ redis_port }}
timeout 0
tcp-keepalive 300

# General
daemonize no
supervised systemd
pidfile {{ redis_pid_dir }}/redis.pid
loglevel notice
logfile {{ redis_log_dir }}/redis.log

# Cluster
cluster-enabled yes
cluster-config-file {{ redis_cluster_config_file }}
cluster-node-timeout {{ redis_cluster_node_timeout }}
cluster-require-full-coverage {{ redis_cluster_require_full_coverage }}

# Snapshotting
databases 1
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir {{ redis_data_dir }}

# Security
{% if redis_requirepass %}
requirepass {{ redis_requirepass }}
masterauth {{ redis_requirepass }}
{% endif %}

# Memory management
maxmemory {{ redis_maxmemory }}
maxmemory-policy {{ redis_maxmemory_policy }}

# Append only file
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
