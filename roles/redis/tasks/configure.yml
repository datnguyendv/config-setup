---
- name: Stop Redis service for configuration
  systemd:
    name: "{{ redis_service_name }}"
    state: stopped
  ignore_errors: yes

- name: Generate Redis configuration
  template:
    src: redis.conf.j2
    dest: "{{ redis_conf_path }}"
    owner: "{{ redis_user }}"
    group: "{{ redis_group }}"
    mode: '0640'
    backup: yes
  notify: restart redis

- name: Set Redis directory permissions
  file:
    path: "{{ redis_dir }}"
    owner: "{{ redis_user }}"
    group: "{{ redis_group }}"
    mode: '0755'
    state: directory

- name: Configure Redis log rotation
  template:
    src: redis-logrotate.j2
    dest: /etc/logrotate.d/redis
    mode: '0644'
  when: redis_log_dir is defined
