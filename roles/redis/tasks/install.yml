---
- name: Install EPEL repository (CentOS/RHEL)
  package:
    name: "{{ redis_epel_repo }}"
    state: present
  when:
    - ansible_os_family == "RedHat"
    - redis_enable_epel | default(false)

- name: Add Redis APT repository (Ubuntu/Debian)
  apt_repository:
    repo: "{{ redis_apt_repository }}"
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"
  ignore_errors: true

- name: Update package cache (Ubuntu/Debian)
  apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install Redis packages
  package:
    name: "{{ redis_packages }}"
    state: present
  notify: restart redis

- name: Create Redis user
  user:
    name: "{{ redis_user }}"
    system: true
    shell: /bin/false
    home: "{{ redis_dir }}"
    create_home: false
  when: redis_user != "redis"

- name: Create Redis directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ redis_user }}"
    group: "{{ redis_group }}"
    mode: '0755'
  loop:
    - "{{ redis_dir }}"
    - "{{ redis_conf_dir }}"
    - "{{ redis_log_dir }}"
    - "/var/run/redis"

- name: Create systemd override directory
  file:
    path: "{{ redis_systemd_override_dir }}"
    state: directory
    mode: '0755'
  when: redis_systemd_service
