---
# Load OS-specific variables
- name: Include OS-specific variables
  include_vars: "{{ ansible_os_family }}.yml"
  failed_when: ansible_os_family not in ['Debian', 'RedHat']

- name: Install Redis packages (RedHat/CentOS)
  yum:
    name: "{{ redis_packages[ansible_os_family] }}"
    state: present
  when: ansible_os_family == "RedHat"

- name: Install Redis packages (Debian/Ubuntu)
  apt:
    name: "{{ redis_packages[ansible_os_family] }}"
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Create redis user
  user:
    name: "{{ redis_user }}"
    group: "{{ redis_group }}"
    system: true
    shell: /bin/false
    home: "{{ redis_data_dir }}"
    create_home: false

- name: Create redis directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ redis_user }}"
    group: "{{ redis_group }}"
    mode: '0755'
  loop:
    - "{{ redis_config_dir }}"
    - "{{ redis_data_dir }}"
    - "{{ redis_log_dir }}"
    - "{{ redis_pid_dir }}"

- name: Check deployment mode
  debug:
    msg: "Deploying Redis in {{ redis_deployment_mode }} mode"

- name: Deploy Redis in standalone mode
  include_tasks: standalone.yml
  when: redis_deployment_mode == "standalone"

- name: Deploy Redis in cluster mode
  include_tasks: cluster.yml
  when: redis_deployment_mode == "cluster"

- name: Enable and start Redis service
  systemd:
    name: "{{ redis_service_name[ansible_os_family] }}"
    enabled: true
    state: started
    daemon_reload: true
  notify: restart redis
