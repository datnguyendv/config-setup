---
- name: Create Kafka directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0755'
  loop:
    - /opt/kafka
    - "{{ kafka_data_dir }}"
    - "{{ kafka_log_dir }}"
    - "{{ kraft_metadata_dir | default('/opt/kafka/kraft-metadata') if (groups['zk'] is not defined or groups['zk']|length == 0) else omit }}"

- name: Download Kafka
  get_url:
    url: "https://dlcdn.apache.org/kafka/{{ kafka_version.split('-')[1] }}/kafka_{{ kafka_version }}.tgz"
    dest: "/tmp/kafka_{{ kafka_version }}.tgz"
    mode: '0644'
    timeout: 300

- name: Extract Kafka
  unarchive:
    src: "/tmp/kafka_{{ kafka_version }}.tgz"
    dest: /opt/kafka
    remote_src: true
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    extra_opts: [--strip-components=1]
    creates: /opt/kafka/bin/kafka-server-start.sh

# NEW: KRaft mode setup
- name: Setup KRaft mode
  include_tasks: kraft_setup.yml
  when: groups['zk'] is not defined or groups['zk']|length == 0

# EXISTING: ZooKeeper mode (keep current logic)
- name: Configure Kafka server properties (ZooKeeper mode)
  template:
    src: server.properties.j2
    dest: /opt/kafka/config/server.properties
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0644'
    backup: true
  notify: restart kafka
  when: groups['zk'] is defined and groups['zk']|length > 0
# - name: Configure Kafka server properties
#   template:
#     src: server.properties.j2
#     dest: /opt/kafka/config/server.properties
#     owner: "{{ kafka_user }}"
#     group: "{{ kafka_group }}"
#     mode: '0644'
#     backup: true
#   notify: restart kafka

- name: Configure Kafka log4j properties
  template:
    src: log4j.properties.j2
    dest: /opt/kafka/config/log4j.properties
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0644'
  notify: restart kafka

- name: Create Kafka systemd service
  template:
    src: kafka.service.j2
    dest: /etc/systemd/system/kafka.service
    mode: '0644'
  notify:
    - reload systemd
    - restart kafka

- name: Start and enable Kafka
  systemd:
    name: kafka
    state: started
    enabled: true
    daemon_reload: true

- name: Verify Kafka is running
  command: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:{{ kafka_port }}
  register: kafka_status
  changed_when: false
  retries: 2
  delay: 10
