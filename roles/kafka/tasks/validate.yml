---
- name: Wait for Kafka to be ready
  wait_for:
    port: 9092
    host: "{{ ansible_default_ipv4.address }}"
    delay: 10
    timeout: 60

- name: Test Kafka cluster connectivity
  shell: |
    {{ kafka_home }}/bin/kafka-broker-api-versions.sh \
    --bootstrap-server {{ ansible_default_ipv4.address }}:9092 \
    --timeout 10000
  register: kafka_connectivity
  failed_when: kafka_connectivity.rc != 0
  changed_when: false

- name: Create test topic
  shell: |
    {{ kafka_home }}/bin/kafka-topics.sh \
    --create --topic ansible-test-{{ ansible_date_time.epoch }} \
    --partitions 3 --replication-factor {{ kafka_default_replication_factor }} \
    --bootstrap-server {{ ansible_default_ipv4.address }}:9092 \
    --if-not-exists
  register: topic_creation
  run_once: true
  changed_when: "'Created topic' in topic_creation.stdout"

- name: List topics to verify cluster
  shell: |
    {{ kafka_home }}/bin/kafka-topics.sh \
    --list --bootstrap-server {{ ansible_default_ipv4.address }}:9092
  register: topic_list
  changed_when: false

- name: Display cluster status
  debug:
    msg: |
      Kafka cluster is healthy
      Available topics: {{ topic_list.stdout_lines | join(', ') }}
      Deployment mode: {{ kafka_deployment_mode }}
