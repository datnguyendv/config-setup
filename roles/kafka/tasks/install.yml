---
- name: Create Kafka directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0755'
  loop:
    - /opt/kafka
    - "{{ kafka_data_dir }}"
    - "{{ kafka_log_dir }}"

- name: Download Kafka
  get_url:
    url: "https://dlcdn.apache.org/kafka/{{ kafka_version.split('-')[1] }}/kafka_{{ kafka_version }}.tgz"
    dest: "/tmp/kafka_{{ kafka_version }}.tgz"
    mode: '0644'
    timeout: 300

- name: Extract Kafka
  unarchive:
    src: "/tmp/kafka_{{ kafka_version }}.tgz"
    dest: /opt/kafka
    remote_src: true
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    extra_opts: [--strip-components=1]
    creates: /opt/kafka/bin/kafka-server-start.sh
