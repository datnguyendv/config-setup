---
- name: Generate broker ID
  set_fact:
    kafka_broker_id: "{{ groups['kafka_cluster'].index(inventory_hostname) + 1 }}"
  when: kafka_broker_id is not defined

- name: Configure Kafka server properties
  template:
    src: server.properties.j2
    dest: "{{ kafka_config_dir }}/server.properties"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0644'
    backup: yes
  notify: restart kafka

- name: Configure Kafka logging
  template:
    src: log4j.properties.j2
    dest: "{{ kafka_config_dir }}/log4j.properties"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0644'
  notify: restart kafka

- name: Set Kafka environment variables
  template:
    src: kafka-env.sh.j2
    dest: "{{ kafka_home }}/bin/kafka-env.sh"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0755'
  notify: restart kafka
