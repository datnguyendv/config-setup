# Kafka Configuration
kafka_version: "2.13-3.9.1"
kafka_port: 9092
kafka_controller_port: 9093
kafka_jmx_port: 9999

kafka_data_dir: "{{ data_dir }}/kafka"
kafka_log_dir: "/var/log/kafka"
kafka_heap_opts: "-Xmx512m -Xms512m"
kafka_meta_dir: "{{ kafka_data_dir }}/metadata"
kafka_home: "/opt/kafka"
kafka_config_path: "{{ kafka_home }}/config"

# Dynamic configuration based on cluster size
kafka_default_replication_factor: "{{ [groups['kfk']|length, 3] | min }}"
kafka_num_partitions: "{{ groups['kfk']|length }}"
offsets_topic_replication_factor: "{{ [groups['kfk']|length, 3] | min }}"
transaction_state_log_replication_factor: "{{ [groups['kfk']|length, 3] | min }}"
kafka_min_insync_replicas: 1
kafka_auto_create_topics: true

# Network Configuration
kafka_socket_send_buffer_bytes: 102400
kafka_socket_receive_buffer_bytes: 102400
kafka_socket_request_max_bytes: 104857600

# Logging
kafka_log_retention_hours: 168
kafka_log_segment_bytes: 1073741824
kafka_log_retention_check_interval_ms: 300000
