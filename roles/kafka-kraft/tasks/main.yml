---
- name: Install dependencies (Debian)
  apt:
    name: "{{ debian_packages }}"
    state: present
  when: ansible_os_family == "Debian" and kafka_install_dependencies

- name: Install dependencies (RedHat)
  yum:
    name: "{{ redhat_packages }}"
    state: present
  when: ansible_os_family == "RedHat" and kafka_install_dependencies

- name: Create kafka group
  group:
    name: "{{ kafka_group }}"
    state: present

- name: Create kafka user
  user:
    name: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    system: true
    shell: /bin/bash
    home: "{{ kafka_home }}"
    create_home: false

- name: Create kafka directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0755'
  loop:
    - "{{ kafka_home }}"
    - "{{ kafka_data_dir }}"
    - "{{ kafka_config_path }}"
    - /var/log/kafka

- name: Check if Kafka is already installed
  stat:
    path: "{{ kafka_home }}/bin/kafka-server-start.sh"
  register: kafka_installed

- name: Download Kafka
  get_url:
    url: "{{ kafka_download_url }}"
    dest: "/tmp/{{ kafka_archive_name }}"
    mode: '0644'
  when: not kafka_installed.stat.exists

- name: Extract Kafka
  unarchive:
    src: "/tmp/{{ kafka_archive_name }}"
    dest: "/opt"
    remote_src: true
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
  when: not kafka_installed.stat.exists
  
- name: Create symlink
  file:
    src: "/opt/kafka_{{ kafka_version }}"
    dest: "{{ kafka_home }}"
    state: link
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
  when: not kafka_installed.stat.exists

- name: Generate controller quorum voters list
  set_fact:
    controller_quorum_voters: >-
      {%- set voters = [] -%}
      {%- for host in groups['kraft'] + groups['kfk'] -%}
        {%- if 'controller' in hostvars[host]['kafka_roles'] -%}
          {%- set node_id = hostvars[host]['kafka_node_id'] -%}
          {%- set hostname = hostvars[host]['hostname'] -%}
          {%- set voter = node_id|string + '@' + hostname + ':' + kafka_controller_port|string -%}
          {%- set _ = voters.append(voter) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ voters | join(',') }}

- name: Generate broker list for inter-broker communication
  set_fact:
    kafka_broker_list: >-
      {%- set brokers = [] -%}
      {%- for host in groups['kraft'] + groups['kfk'] -%}
        {%- if 'broker' in hostvars[host]['kafka_roles'] -%}
          {%- set hostname = hostvars[host]['hostname'] -%}
          {%- set broker = hostname + ':' + kafka_port|string -%}
          {%- set _ = brokers.append(broker) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ brokers | join(',') }}

- name: Template server.properties
  template:
    src: server.properties.j2
    dest: "{{ kafka_config_path }}/server.properties"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0644'
  notify: restart kafka

- name: Template systemd service
  template:
    src: kafka.service.j2
    dest: /etc/systemd/system/kafka.service
    mode: '0644'
  notify:
    - reload systemd
    - restart kafka

- name: Set proper ownership
  file:
    path: "{{ item }}"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    recurse: true
  loop:
    - "{{ kafka_home }}"
    - "{{ kafka_data_dir }}"
    - /var/log/kafka

- name: Enable and start kafka service
  systemd:
    name: kafka
    enabled: true
    state: started
    daemon_reload: true
