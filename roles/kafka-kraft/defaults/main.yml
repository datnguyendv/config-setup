---
# Kafka version and paths
kafka_version: "2.13-3.9.1"
kafka_scala_version: "2.13"
kafka_home: "/opt/kafka"
kafka_user: "kafka"
kafka_group: "kafka"

# Configuration paths
kafka_config_path: "{{ kafka_home }}/config"
kafka_data_dir: "/var/kafka-logs"
kafka_meta_dir: "{{ kafka_data_dir }}"

# Network configuration
kafka_port: 9092
kafka_controller_port: 9093
kafka_jmx_port: 9999

# JVM settings
kafka_heap_size: "1G"
kafka_java_opts: "-XX:+UseG1GC -XX:MaxGCPauseMillis=20"

# KRaft specific settings
kafka_install_dependencies: true
kafka_auto_create_topics: false
kafka_num_network_threads: 3
kafka_num_io_threads: 8
kafka_socket_send_buffer_bytes: 102400
kafka_socket_receive_buffer_bytes: 102400
kafka_socket_request_max_bytes: 104857600

# Replication settings
kafka_default_replication_factor: 2
kafka_min_insync_replicas: 1
kafka_num_partitions: 3

# Log retention
kafka_log_retention_hours: 168
kafka_log_segment_bytes: 1073741824
kafka_log_retention_check_interval_ms: 300000

kafka_download_url: "https://downloads.apache.org/kafka/{{ kafka_version.split('-')[1] }}/kafka_{{ kafka_version }}.tgz"
kafka_archive_name: "kafka_{{ kafka_version }}.tgz"

# OS specific packages
debian_packages:
  - openjdk-17-jre-headless
  - acl
  - wget
  - tar

redhat_packages:
  - java-17-openjdk-headless
  - wget
  - tar
  - which
