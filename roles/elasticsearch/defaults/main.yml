---
# Elasticsearch version and basic settings
elasticsearch_version: "8.11.0"
elasticsearch_major_version: 8
elasticsearch_deployment_mode: single-node

# Cluster configuration
elasticsearch_cluster_name: "my-elasticsearch-cluster"
elasticsearch_node_name: "{{ hostname }}"
elasticsearch_network_host: "0.0.0.0"
elasticsearch_http_port: 9200
elasticsearch_transport_port: 9300

# Node roles (for cluster mode)
elasticsearch_node_roles: ['master', 'data', 'ingest']
elasticsearch_master_node: true
elasticsearch_data_node: true
elasticsearch_ingest_node: true
elasticsearch_ml_node: false

# Cluster discovery (will be auto-generated from inventory)
elasticsearch_initial_master_nodes: []
elasticsearch_seed_hosts: []
elasticsearch_minimum_master_nodes: 2
elasticsearch_expected_master_nodes: 3
elasticsearch_recover_after_nodes: 2

# Memory and JVM settings
elasticsearch_heap_size: "512m"
elasticsearch_java_home: ""

# Security settings
elasticsearch_security_enabled: false
elasticsearch_security_enrollment_enabled: false
elasticsearch_bootstrap_password: "changeme"

# Directory paths
elasticsearch_home: "/usr/share/elasticsearch"
elasticsearch_config_dir: "/etc/elasticsearch"
elasticsearch_data_dir: "/mnt/data/elasticsearch"
elasticsearch_log_dir: "/var/log/elasticsearch"

# Service configuration
elasticsearch_service_enabled: true
elasticsearch_service_state: started
elasticsearch_restart_on_change: true

# Cluster settings
elasticsearch_rack_id: "default-rack"
elasticsearch_shard_allocation_awareness: false
