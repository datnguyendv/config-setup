---
- name: Create certificates directory
  file:
    path: "{{ elasticsearch_config_dir }}/certs"
    state: directory
    owner: "{{ elasticsearch_user }}"
    group: "{{ elasticsearch_group }}"
    mode: '0750'

- name: Setup Elasticsearch bootstrap password
  when:
    - elasticsearch_security_enabled | default(false)
    - elasticsearch_bootstrap_password is defined
  block:
    - name: Create keystore if not exists
      shell: /usr/share/elasticsearch/bin/elasticsearch-keystore create
      args:
        creates: /etc/elasticsearch/elasticsearch.keystore

    - name: Add bootstrap password to keystore
      shell: |
        echo "{{ elasticsearch_bootstrap_password }}" | \
        /usr/share/elasticsearch/bin/elasticsearch-keystore add -x 'bootstrap.password' --stdin --force
      no_log: true

    - name: Set keystore permissions
      file:
        path: /etc/elasticsearch/elasticsearch.keystore
        owner: elasticsearch
        group: elasticsearch
        mode: '0660'

- name: Generate node-specific certificates
  shell: |
    /usr/share/elasticsearch/bin/elasticsearch-certutil cert \
      --ca-cert /etc/elasticsearch/certs/ca/ca.crt \
      --ca-key /etc/elasticsearch/certs/ca/ca.key \
      --pem \
      --name {{ hostname }} \
      --dns {{ hostname }} \
      --ip {{ ansible_default_ipv4.address }} \
      --out /etc/elasticsearch/certs/{{ hostname }}-certs.zip
  delegate_to: "{{ groups['es'][0] }}"
  run_once: true

- name: Extract and deploy certificates
  unarchive:
    src: /etc/elasticsearch/certs/{{ hostname }}-certs.zip
    dest: /etc/elasticsearch/certs/
    remote_src: true

- name: Set certificate permissions
  file:
    path: "{{ item.path }}"
    owner: elasticsearch
    group: elasticsearch
    mode: "{{ item.mode }}"
  loop:
    - { path: "/etc/elasticsearch/certs/{{ inventory_hostname }}/{{ hostname }}.key", mode: "0600" }
    - { path: "/etc/elasticsearch/certs/{{ inventory_hostname }}/{{ hostname }}.crt", mode: "0644" }
    - { path: "/etc/elasticsearch/certs/ca/ca.crt", mode: "0644" }
