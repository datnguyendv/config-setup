---
- name: Create certificates directory
  file:
    path: "{{ elasticsearch_config_dir }}/certs"
    state: directory
    owner: "{{ elasticsearch_user }}"
    group: "{{ elasticsearch_group }}"
    mode: '0750'

- name: Check if CA exists
  stat:
    path: "{{ elasticsearch_config_dir }}/certs/elastic-stack-ca.p12"
  register: ca_exists

- name: Generate CA certificate (on first master only)
  shell: |
    {{ elasticsearch_home }}/bin/elasticsearch-certutil ca \
      --out {{ elasticsearch_config_dir }}/certs/elastic-stack-ca.p12 \
      --pass ""
  when:
    - not ca_exists.stat.exists
    - inventory_hostname == groups['elasticsearch'][0] or elasticsearch_deployment_mode == 'single-node'
  become_user: "{{ elasticsearch_user }}"

- name: Generate node certificates (on first master only)
  shell: |
    {{ elasticsearch_home }}/bin/elasticsearch-certutil cert \
      --ca {{ elasticsearch_config_dir }}/certs/elastic-stack-ca.p12 \
      --ca-pass "" \
      --out {{ elasticsearch_config_dir }}/certs/elastic-certificates.p12 \
      --pass ""
  when:
    - not ca_exists.stat.exists
    - inventory_hostname == groups['elasticsearch'][0] or elasticsearch_deployment_mode == 'single-node'
  become_user: "{{ elasticsearch_user }}"

- name: Fetch certificates from first master
  fetch:
    src: "{{ elasticsearch_config_dir }}/certs/{{ item }}"
    dest: "/tmp/elasticsearch-certs/{{ item }}"
    flat: true
  loop:
    - elastic-stack-ca.p12
    - elastic-certificates.p12
  when:
    - inventory_hostname == groups['elasticsearch'][0] or elasticsearch_deployment_mode == 'single-node'
    - elasticsearch_deployment_mode == 'cluster'

- name: Distribute certificates to all nodes
  copy:
    src: "/tmp/elasticsearch-certs/{{ item }}"
    dest: "{{ elasticsearch_config_dir }}/certs/{{ item }}"
    owner: "{{ elasticsearch_user }}"
    group: "{{ elasticsearch_group }}"
    mode: '0644'
  loop:
    - elastic-stack-ca.p12
    - elastic-certificates.p12
  when:
    - elasticsearch_deployment_mode == 'cluster'
    - inventory_hostname != groups['elasticsearch'][0]
