---
- name: Create Elasticsearch directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ elasticsearch_user }}"
    group: "{{ elasticsearch_group }}"
    mode: '0755'
  loop:
    - "{{ elasticsearch_config_dir }}"
    - "{{ elasticsearch_data_dir }}"
    - "{{ elasticsearch_log_dir }}"

- name: Generate Elasticsearch configuration
  template:
    src: elasticsearch.yml.j2
    dest: "{{ elasticsearch_config_file }}"
    owner: "{{ elasticsearch_user }}"
    group: "{{ elasticsearch_group }}"
    mode: '0644'
  notify: restart elasticsearch

- name: Generate JVM options
  template:
    src: jvm.options.j2
    dest: "{{ elasticsearch_config_dir }}/jvm.options"
    owner: "{{ elasticsearch_user }}"
    group: "{{ elasticsearch_group }}"
    mode: '0644'
  notify: restart elasticsearch

- name: Set JAVA_HOME in systemd service
  template:
    src: systemd.j2
    dest: "{{ elasticsearch_systemd_dir }}/elasticsearch.service.d/override.conf"
    mode: '0644'
  notify:
    - reload systemd
    - restart elasticsearch
  when: elasticsearch_java_home != ""
