---
- name: Create Zookeeper directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0755'
  loop:
    - /opt/zookeeper
    - "{{ zookeeper_data_dir }}"
    - "{{ zookeeper_log_dir }}"

- name: Download Zookeeper
  get_url:
    url: "https://www.apache.org/dyn/closer.lua/zookeeper/zookeeper-{{ zookeeper_version }}/apache-zookeeper-{{ zookeeper_version }}-bin.tar.gz"
    dest: "/tmp/zookeeper-{{ zookeeper_version }}.tar.gz"
    mode: '0644'
    timeout: 300
  retries: 3
  delay: 10

- name: Extract Zookeeper
  unarchive:
    src: "/tmp/zookeeper-{{ zookeeper_version }}.tar.gz"
    dest: /opt/zookeeper
    remote_src: true
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    extra_opts: [--strip-components=1]
    creates: /opt/zookeeper/bin/zkServer.sh
