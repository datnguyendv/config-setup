---
- name: Create ZooKeeper user and group
  group:
    name: "{{ zookeeper_group }}"
    state: present

- name: Create ZooKeeper user
  user:
    name: "{{ zookeeper_user }}"
    group: "{{ zookeeper_group }}"
    home: "{{ zookeeper_home }}"
    shell: /bin/bash
    system: true
    createhome: false

- name: Install Java (Debian/Ubuntu)
  apt:
    name: openjdk-11-jdk
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install Java (RedHat/CentOS)
  package:
    name: java-11-openjdk-devel
    state: present
  when: ansible_os_family == "RedHat"

- name: Create ZooKeeper directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ zookeeper_user }}"
    group: "{{ zookeeper_group }}"
    mode: '0755'
  loop:
    - "{{ zookeeper_home }}"
    - "{{ zookeeper_data_dir }}"
    - "{{ zookeeper_log_dir }}"
    - "{{ zookeeper_home }}/conf"

- name: Check if ZooKeeper is already installed
  stat:
    path: "{{ zookeeper_home }}/bin/zkServer.sh"
  register: zookeeper_installed

- name: Download ZooKeeper
  get_url:
    url: "{{ zookeeper_download_url }}"
    dest: "/tmp/apache-zookeeper-{{ zookeeper_version }}-bin.tar.gz"
    mode: '0644'
  when: not zookeeper_installed.stat.exists

- name: Extract ZooKeeper
  unarchive:
    src: "/tmp/apache-zookeeper-{{ zookeeper_version }}-bin.tar.gz"
    dest: "/tmp"
    remote_src: true
    owner: "{{ zookeeper_user }}"
    group: "{{ zookeeper_group }}"
  when: not zookeeper_installed.stat.exists

- name: Copy ZooKeeper files
  shell: |
    cp -r /tmp/apache-zookeeper-{{ zookeeper_version }}-bin/* {{ zookeeper_home }}/
    chown -R {{ zookeeper_user }}:{{ zookeeper_group }} {{ zookeeper_home }}
  when: not zookeeper_installed.stat.exists
  notify: restart zookeeper

- name: Clean up download files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/apache-zookeeper-{{ zookeeper_version }}-bin.tar.gz"
    - "/tmp/apache-zookeeper-{{ zookeeper_version }}-bin"
  when: not zookeeper_installed.stat.exists
