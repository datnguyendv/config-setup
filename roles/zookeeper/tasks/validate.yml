---
- name: Wait for ZooKeeper to be ready
  wait_for:
    port: "{{ zookeeper_client_port }}"
    host: "{{ ansible_default_ipv4.address }}"
    delay: 5
    timeout: 30

- name: Check ZooKeeper status
  shell: echo ruok | nc localhost {{ zookeeper_client_port }}
  register: zk_status
  failed_when: zk_status.stdout != "imok"
  changed_when: false

- name: Validate ZooKeeper cluster
  shell: echo stat | nc localhost {{ zookeeper_client_port }}
  register: zk_stat
  failed_when: "'Mode:' not in zk_stat.stdout"
  changed_when: false

- name: Display ZooKeeper status
  debug:
    msg: "ZooKeeper is running in {{ zk_stat.stdout | regex_search('Mode: (\\w+)', '\\1') | first }} mode"
