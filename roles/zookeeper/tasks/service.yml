---
- name: Create ZooKeeper systemd service
  template:
    src: zookeeper.service.j2
    dest: /etc/systemd/system/zookeeper.service
    mode: '0644'
  notify:
    - reload systemd
    - restart zookeeper

- name: Start and enable ZooKeeper service
  systemd:
    name: zookeeper
    state: started
    enabled: true
    daemon_reload: true
