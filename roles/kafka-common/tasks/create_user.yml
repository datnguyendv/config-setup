---
- name: Create kafka group
  group:
    name: "{{ kafka_group }}"
    state: present
    system: true

- name: Create kafka user
  user:
    name: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    system: true
    shell: /bin/false
    home: "{{ kafka_home }}"
    createhome: false
    comment: "Kafka service user"

- name: Create kafka home directory
  file:
    path: "{{ kafka_home }}"
    state: directory
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0755'

- name: Install common packages for Debian/Ubuntu
  apt:
    name:
      - curl
      - tar
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install common packages for CentOS/RHEL
  yum:
    name:
      - curl
      - tar
    state: present
  when: ansible_os_family == "RedHat"

