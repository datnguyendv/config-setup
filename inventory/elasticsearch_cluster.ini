[elasticsearch_masters]
es-master-1 ansible_host=192.168.1.10 elasticsearch_node_roles=['master'] elasticsearch_rack_id=rack-1
es-master-2 ansible_host=192.168.1.11 elasticsearch_node_roles=['master'] elasticsearch_rack_id=rack-2
es-master-3 ansible_host=192.168.1.12 elasticsearch_node_roles=['master'] elasticsearch_rack_id=rack-3

[elasticsearch_data]
es-data-1 ansible_host=192.168.1.20 elasticsearch_node_roles=['data','ingest'] elasticsearch_rack_id=rack-1
es-data-2 ansible_host=192.168.1.21 elasticsearch_node_roles=['data','ingest'] elasticsearch_rack_id=rack-2
es-data-3 ansible_host=192.168.1.22 elasticsearch_node_roles=['data','ingest'] elasticsearch_rack_id=rack-3

[elasticsearch_coordinating]
es-coord-1 ansible_host=192.168.1.30 elasticsearch_node_roles=[] elasticsearch_rack_id=rack-1

[elasticsearch:children]
elasticsearch_masters
elasticsearch_data
elasticsearch_coordinating

[elasticsearch:vars]
elasticsearch_deployment_mode=cluster
elasticsearch_cluster_name=production-cluster
elasticsearch_heap_size=4g
elasticsearch_security_enabled=true
