- name: Initial instance config
  hosts: all
  become: true
  roles:
    - vm-initial

- name: Install Docker
  hosts: all
  become: true
  roles:
    - docker

- name: Export metric
  hosts: all
  become: true
  roles:
    - node-exporter

- name: Register metric monitor
  hosts: all
  become: true
  roles:
    - metric-register
