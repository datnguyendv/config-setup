---
- name: Deploy Multiple Redis Instances
  hosts: redis_servers
  become: true
  vars:
    redis_instances:
      - name: "redis-cache"
        port: 6379
        maxmemory: "512mb"
        maxmemory_policy: "allkeys-lru"
        databases: 16
      - name: "redis-session"
        port: 6380
        maxmemory: "256mb"
        maxmemory_policy: "allkeys-lru"
        databases: 1
      - name: "redis-queue"
        port: 6381
        maxmemory: "1gb"
        maxmemory_policy: "noeviction"
        databases: 1
  roles:
    - redis


